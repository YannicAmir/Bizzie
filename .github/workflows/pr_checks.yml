name: PR Checks

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    env:
      DEV_OPT: ${{ secrets.DEV_FIREBASE_OPTIONS_DART_BASE64 }}
      QA_OPT: ${{ secrets.QA_FIREBASE_OPTIONS_DART_BASE64 }}
      PROD_OPT: ${{ secrets.PROD_FIREBASE_OPTIONS_DART_BASE64 }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Decode Firebase Configuration
        run: |
          mkdir -p lib/config/firebase
          echo "$DEV_OPT" | base64 --decode > lib/config/firebase/firebase_options_dev.dart
          echo "$QA_OPT" | base64 --decode > lib/config/firebase/firebase_options_qa.dart
          echo "$PROD_OPT" | base64 --decode > lib/config/firebase/firebase_options_prod.dart
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Analyze Code
        run: flutter analyze
        
      - name: Run Tests
        run: flutter test
