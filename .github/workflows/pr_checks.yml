name: PR Checks

on:
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    name: Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Analyze Code
        run: flutter analyze
        
      - name: Run Tests
        run: flutter test
