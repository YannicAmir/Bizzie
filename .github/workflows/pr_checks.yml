name: PR Checks

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    env:
      DEV_OPT: ${{ secrets.DEV_FIREBASE_OPTIONS_DART_BASE64 }}
      QA_OPT: ${{ secrets.QA_FIREBASE_OPTIONS_DART_BASE64 }}
      PROD_OPT: ${{ secrets.PROD_FIREBASE_OPTIONS_DART_BASE64 }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Decode Firebase Configuration
        run: |
          mkdir -p lib/config/firebase
          echo "$DEV_OPT" | base64 --decode > lib/config/firebase/firebase_options_dev.dart
          echo "$QA_OPT" | base64 --decode > lib/config/firebase/firebase_options_qa.dart
          echo "$PROD_OPT" | base64 --decode > lib/config/firebase/firebase_options_prod.dart
          
      - name: Install Dependencies
        run: flutter pub get
        
      # NEW: Create the .env files from GitHub Secrets
      - name: Create .env files
        run: |
          touch .env.dev .env.qa .env.prod
          
          # DEV
          echo "FMP_API_KEY=${{ secrets.DEV_FMP_API_KEY }}" >> .env.dev
          echo "REVENUECAT_PUBLIC_API_KEY_IOS=${{ secrets.DEV_REVENUECAT_PUBLIC_API_KEY_IOS }}" >> .env.dev
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> .env.dev
          echo "BUNDLE_ID=${{ secrets.DEV_BUNDLE_ID }}" >> .env.dev

          # QA
          echo "FMP_API_KEY=${{ secrets.QA_FMP_API_KEY }}" >> .env.qa
          echo "REVENUECAT_PUBLIC_API_KEY_IOS=${{ secrets.QA_REVENUECAT_PUBLIC_API_KEY_IOS }}" >> .env.qa
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> .env.qa
          echo "BUNDLE_ID=${{ secrets.QA_BUNDLE_ID }}" >> .env.qa

          # PROD
          echo "FMP_API_KEY=${{ secrets.PROD_FMP_API_KEY }}" >> .env.prod
          echo "REVENUECAT_PUBLIC_API_KEY_IOS=${{ secrets.PROD_REVENUECAT_PUBLIC_API_KEY_IOS }}" >> .env.prod
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> .env.prod
          echo "BUNDLE_ID=${{ secrets.PROD_BUNDLE_ID }}" >> .env.prod

      # NEW: Generate ALL required code (Freezed, JsonSerializable, Envied, Injectable)
      - name: Generate All Code (Freezed, Envied, etc.)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Code
        run: flutter analyze
        
      - name: Run Tests
        run: flutter test
