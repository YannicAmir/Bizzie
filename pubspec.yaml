name: bizzie
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.0


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  envied: ^1.3.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  google_fonts: ^6.3.3
  go_router: ^17.0.1
  dartz: ^0.10.1
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1
  injectable: ^2.7.1+4
  get_it: ^9.2.0
  logging: ^1.3.0
  genui: ^0.6.0
  genui_firebase_ai: ^0.6.0
  cloud_firestore: ^6.1.1
  firebase_remote_config: ^6.1.3
  device_info_plus: ^12.3.0
  syncfusion_flutter_charts: ^32.1.21
  dio: ^5.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  firebase_storage: ^13.0.5
  equatable: ^2.0.8
  bloc: ^9.2.0
  flutter_native_splash: ^2.4.6
  async: ^2.13.0
  firebase_ai: ^3.6.1
  flutter_svg: ^2.2.3
  rxdart: ^0.28.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^2.0.1
  timeago: ^3.7.1
  custom_refresh_indicator: ^4.0.1
  bloc_concurrency: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  envied_generator: ^1.3.1
  build_runner: ^2.10.4
  flutter_launcher_icons: ^0.14.4

  freezed: ^3.2.3
  json_serializable: ^6.11.2
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  injectable_generator: ^2.9.1
  fake_cloud_firestore: ^4.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/shared/
    - assets/images/auth/
    - assets/images/onboarding/
    - assets/images/search/
    - assets/images/home/
    - assets/images/company_profile/
    - assets/images/branding/

